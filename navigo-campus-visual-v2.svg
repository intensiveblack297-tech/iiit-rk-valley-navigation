<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">NAVIGO campus navigation</title>
<desc id="desc">Illustrated IIIT RK Valley campus with a QR sign, landscaped walkway, and phone showing an indoor route.</desc>
