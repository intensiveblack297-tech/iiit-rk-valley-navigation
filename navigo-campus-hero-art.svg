<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
<title id="title">NAVIGO campus route illustration</title>
<desc id="desc">A calm, modern illustration of a university campus, a QR wayfinding sign, a curving path and a phone with a blue route.</desc>
<defs>
