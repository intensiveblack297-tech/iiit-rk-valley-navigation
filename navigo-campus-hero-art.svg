 <linearGradient id="window" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cd3d9"/><stop offset="1" stop-color="#4a9ca5"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f9fff9"/><stop offset="1" stop-color="#dfefe5"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#143d40" flood-opacity=".15"/></filter>
 <clipPath id="clip"><rect width="760" height="650" rx="30"/></clipPath>
</defs>
